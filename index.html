<title>Outreach Tracker — Basil Haseeb</title>
<script>
(function() {
  const HASH = '9a2e5f8b1c4d7e0f3a6b9c2e5f8b1c4d7e0f3a6b9c2e5f8b1c4d7e0f3a6b9c';
  function h(s) {
    let hash = 0;
    for (let i = 0; i < s.length; i++) {
      hash = ((hash << 5) - hash) + s.charCodeAt(i);
      hash |= 0;
    }
    return Math.abs(hash).toString(16).padStart(8,'0');
  }
  if (localStorage.getItem('tracker_auth') !== 'granted') {
    document.addEventListener('DOMContentLoaded', function() {
      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;inset:0;background:#1C1917;display:flex;align-items:center;justify-content:center;z-index:9999;';
      overlay.innerHTML = `
        <div style="background:#fff;border-radius:16px;padding:40px;width:340px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.3);">
          <div style="font-size:28px;margin-bottom:8px;">📋</div>
          <div style="font-family:Georgia,serif;font-size:22px;font-weight:700;color:#1C1917;margin-bottom:4px;">Partnership Tracker</div>
          <div style="font-size:13px;color:#78716C;margin-bottom:28px;">Basil Haseeb · Creator Outreach</div>
          <input id="pw-input" type="password" placeholder="Enter password" style="width:100%;box-sizing:border-box;padding:12px 16px;border:1.5px solid #E2DDD6;border-radius:8px;font-size:15px;outline:none;margin-bottom:12px;" />
          <button id="pw-btn" style="width:100%;padding:12px;background:#1A5276;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;">Unlock</button>
          <div id="pw-err" style="color:#EF4444;font-size:13px;margin-top:10px;display:none;">Incorrect password. Try again.</div>
        </div>`;
      document.body.appendChild(overlay);
      const input = document.getElementById('pw-input');
      const btn = document.getElementById('pw-btn');
      const err = document.getElementById('pw-err');
      function tryUnlock() {
        if (h(input.value) === h('Bismillah1!')) {
          localStorage.setItem('tracker_auth', 'granted');
          overlay.remove();
        } else {
          err.style.display = 'block';
          input.value = '';
          input.focus();
        }
      }
      btn.addEventListener('click', tryUnlock);
      input.addEventListener('keydown', function(e) { if (e.key === 'Enter') tryUnlock(); });
      input.focus();
    });
  }
})();
</script>

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;

  }

  /* ── Header ── */
  .header {
    max-width: 1280px;
    margin: 0 auto 24px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;

  }

  .header-left { display: flex; flex-direction: column; gap: 4px; }

  .eyebrow {

    color: var(--accent);
  }

  h1 {
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -.02em;
    line-height: 1.2;
  }

  .header-sub {
    font-size: 13px;
    color: var(--text-sub);
    margin-top: 2px;
  }

  .header-actions { display: flex; gap: 8px; align-items: center; }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    transition: background .15s, border-color .15s;
    white-space: nowrap;
  }
  .btn:hover { background: var(--surface-2); }
  .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-primary:hover { opacity: .9; background: var(--accent); }

  /* ── Stat tiles ── */
  .stats {
    max-width: 1280px;
    margin: 0 auto 20px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 10px;
  }

  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    font: inherit;
    text-align: left;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .stat:hover { border-color: var(--accent); }
  .stat.active { border-color: var(--accent); background: var(--accent-light); }
  .stat.active .stat-label { color: var(--accent); }
  .stat.stat-next { border-top: 3px solid #DC2626; }
  .stat.stat-next .stat-label { color: #DC2626; }
  .stat.stat-next.active { background: rgba(239, 68, 68, .12); border-color: #DC2626; }

  .stat-value {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -.03em;
    font-variant-numeric: tabular-nums;
    color: var(--text);
    line-height: 1;
  }

  .stat-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--text-sub);
  }

  .stat-accent { border-top: 3px solid var(--accent); }

  /* ── Tabs ── */
  .tabs-wrap {
    max-width: 1280px;
    margin: 0 auto 0;

  .tabs {
    display: flex;
    gap: 2px;
    border-bottom: 2px solid var(--border);
    overflow-x: auto;
    scrollbar-width: none;

  .tabs::-webkit-scrollbar { display: none; }

  .tab {
    padding: 9px 16px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-sub);
    cursor: pointer;
    border: none;
    background: none;
    white-space: nowrap;
    border-bottom: 2px solid transparent;
    margin-bottom: -2px;
    transition: color .15s;
    display: flex;
    align-items: center;
    gap: 7px;
    font-family: inherit;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

  .tab-count {
    font-size: 11px;
    font-weight: 600;
    padding: 1px 6px;
    border-radius: 99px;
    background: var(--surface-2);
    color: var(--text-sub);
    font-variant-numeric: tabular-nums;
  }
  .tab.active .tab-count { background: var(--accent-light); color: var(--accent); }

  /* ── Toolbar ── */
  .toolbar {
    max-width: 1280px;
    margin: 12px auto 12px;
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }

  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 180px;
  }

  .search-icon {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-placeholder);
    pointer-events: none;
  }

  .search-clear {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--text-placeholder);
    color: var(--surface);
    border: none;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    line-height: 1;
    padding: 0;

  }
  .search-clear:hover { background: var(--text-sub); }
  .search-clear.visible { display: flex; }

  input[type="text"], select {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);

    padding: 7px 10px 7px 32px;
    outline: none;
    font-family: inherit;
  }

  select { padding-left: 10px; cursor: pointer; }
  input[type="text"]:focus, select:focus { border-color: var(--accent); }
  input[type="text"]::placeholder { color: var(--text-placeholder); }

  /* ── Table ── */
  .table-wrap {
    max-width: 1280px;

    border: 1px solid var(--border);

  .table-scroll { overflow-x: auto; }

  thead { background: var(--surface-2); }

    font-size: 11px;

  }

  th:hover { color: var(--text); }
  th .sort-arrow { margin-left: 4px; opacity: .4; }
  th.sorted .sort-arrow { opacity: 1; color: var(--accent); }

  td { padding: 11px 14px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  tr.filtered-out { display: none; }
  tr:hover td { background: var(--accent-light); }

  /* ── Org cell ── */
  .org-name { font-weight: 600; color: var(--text); }
  .org-location { font-size: 11px; color: var(--text-sub); margin-top: 1px; }

  /* ── Contact cell ── */
  .contact-name { font-weight: 500; }
  .contact-title { font-size: 12px; color: var(--text-sub); margin-top: 1px; }
  .contact-email {
    font-size: 12px;
    color: var(--accent);
    margin-top: 2px;
    font-family: ui-monospace, monospace;
    border: 1px solid transparent;
    border-radius: 4px;
    padding: 2px 5px;
    cursor: text;
    display: inline-block;
    min-width: 40px;
    word-break: break-all;
  }
  .contact-email:hover { border-color: var(--border); background: var(--surface-2); }
  .contact-email:focus { border-color: var(--accent); background: var(--surface-2); outline: none; }

  .cc-toggle {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-top: 5px;
    font-size: 11px;
    color: var(--text-sub);
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    transition: background .1s;
  }
  .cc-toggle:hover { background: var(--border); }

  .cc-list {
    display: none;
    margin-top: 6px;
    padding: 8px 10px;
    background: var(--surface-2);
    border-radius: 6px;
    border: 1px solid var(--border);
    font-size: 12px;
    color: var(--text-sub);
    line-height: 1.9;
    white-space: pre-wrap;
    word-break: break-all;
    cursor: text;
    min-height: 32px;
    outline: none;
  }
  .cc-list.open { display: block; }
  .cc-list:focus { border-color: var(--accent); background: var(--surface); }
  .cc-hint {
    font-size: 10px;
    color: var(--text-placeholder);
    margin-top: 4px;
    display: none;
    font-style: italic;
  }
  .cc-list.open + .cc-hint { display: block; }

  /* ── Status pill ── */
  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 99px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: opacity .1s;
    user-select: none;
  }
  .status-pill:hover { opacity: .82; }
  .status-pill::before { content: ''; width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .status-pill { position: relative; padding-right: 8px; }
  .status-select {
    appearance: none; -webkit-appearance: none;
    background: transparent; border: 0; outline: none;
    color: inherit; font: inherit; cursor: pointer;
    padding: 0 14px 0 0; margin: 0;
  }
  .status-select:focus-visible { text-decoration: underline; }
  .status-select option { color: var(--text); background: var(--surface); }
  .status-caret { position: absolute; right: 9px; pointer-events: none; font-size: 9px; }

  /* ── Undo toast ── */
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px);
    background: var(--text); color: var(--surface);
    padding: 10px 14px; border-radius: 10px; font-size: 13px;
    display: flex; align-items: center; gap: 14px;
    opacity: 0; pointer-events: none; transition: opacity .15s, transform .15s; z-index: 1000;
    max-width: calc(100vw - 32px);
  }
  .toast.show { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
  .toast button {
    background: transparent; border: 1px solid currentColor; color: inherit;
    border-radius: 6px; padding: 3px 10px; font: inherit; font-weight: 600; cursor: pointer;
  }

  .status-draft     { background: var(--s-draft-bg);   color: var(--s-draft-text);   }
  .status-draft::before     { background: var(--s-draft-dot);   }
  .status-sent      { background: var(--s-sent-bg);    color: var(--s-sent-text);    }
  .status-sent::before      { background: var(--s-sent-dot);    }
  .status-awaiting  { background: var(--s-awaiting-bg);color: var(--s-awaiting-text);}
  .status-awaiting::before  { background: var(--s-awaiting-dot);}
  .status-convo     { background: var(--s-convo-bg);   color: var(--s-convo-text);   }
  .status-convo::before     { background: var(--s-convo-dot);   }
  .status-followup  { background: var(--s-followup-bg);color: var(--s-followup-text);}
  .status-followup::before  { background: var(--s-followup-dot);}
  .status-closed    { background: var(--s-closed-bg);  color: var(--s-closed-text);  }
  .status-closed::before    { background: var(--s-closed-dot);  }
  .status-declined  { background: var(--s-declined-bg);color: var(--s-declined-text);}
  .status-declined::before  { background: var(--s-declined-dot);}

  /* ── Follow-up stack ── */
  .followup-stack { display: flex; flex-direction: column; gap: 5px; }
  .followup-row { display: flex; align-items: center; gap: 6px; }
  .followup-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .05em;
    text-transform: uppercase;
    color: var(--text-placeholder);
    width: 32px;
    flex-shrink: 0;
  }

  /* ── Date input ── */
  input[type="date"] {
    background: transparent;
    border: 1px solid transparent;
    border-radius: 5px;
    color: var(--text);
    font-size: 12px;
    font-family: ui-monospace, monospace;
    padding: 3px 6px;
    cursor: pointer;
    width: 130px;
    outline: none;
  }
  input[type="date"]:hover { border-color: var(--border); background: var(--surface-2); }
  input[type="date"]:focus { border-color: var(--accent); background: var(--surface-2); }

  /* Next F/U = red (solid once the date arrives); sent follow-ups F/U 1-3 = yellow (only once a date is set) */
  input[type="date"].fu-next.filled { background: rgba(239, 68, 68, .22); border-color: rgba(220, 38, 38, .6); font-weight: 600; }
  input[type="date"].fu-next.filled.soon { background: rgba(239, 68, 68, .45); border-color: #DC2626; }
  input[type="date"].fu-next.filled.due { background: #DC2626; border-color: #DC2626; color: #fff; }
  input[type="date"].fu-sent.filled { background: rgba(250, 204, 21, .35); border-color: rgba(202, 138, 4, .6); font-weight: 600; }
  .followup-row.next-row { margin-bottom: 7px; }
  .followup-row.next-row .followup-label { color: #DC2626; }

  /* ── Notes ── */
  .note-cell { min-width: 180px; max-width: 240px; }

  .note-text {
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    border: 1px solid transparent;
    border-radius: 5px;
    padding: 3px 6px;
    min-height: 26px;
    display: block;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .note-text:empty::before { content: 'Add note…'; color: var(--text-placeholder); font-style: italic; }
  .note-text:hover { border-color: var(--border); background: var(--surface-2); }
  .note-text:focus { border-color: var(--accent); background: var(--surface-2); outline: none; }

/* ── Active / Archive view switch ── */
  .view-switch {
    max-width: 1280px;
    margin: 0 auto 16px;
    display: flex;
    gap: 6px;
  }
  .view-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-sub);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s, color .15s, border-color .15s;
  }
  .view-btn:hover { background: var(--surface-2); color: var(--text); }
  .view-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .view-btn .view-count {
    font-size: 12px;

// The tracker lives in a Google Sheet ("Partnership Tracker" in basilhaseeb@gmail.com's Drive), served by an
// Apps Script web app (sheets_backend.gs). GET returns all rows; POST replaces all rows.
const SHEET_URL = 'https://script.google.com/macros/s/AKfycbzgM24WZSC9eza_9ygTn3MAoNXKd4XgkLyWsmXahDEdP8wDy78nzo8HGDd0EvoK_zP3/exec';
// The access key is not in this (public) page. It is entered once per device and kept in this browser.
let SHEET_KEY = '';
try { SHEET_KEY = localStorage.getItem('tracker_key') || ''; } catch (e) {}
function askKey() {
  const k = (prompt('Enter your tracker access key:') || '').trim();
  if (k) { SHEET_KEY = k; try { localStorage.setItem('tracker_key', k); } catch (e) {} }
  return !!k;
}

let data = [];
let activeTab = 'all';
let saveTimer = null;
let canSave = false;              // stays false if loading failed, so a partial view never overwrites stored data
let lastSaved = '';

async function load() {
  document.getElementById('tbody').innerHTML =
    '<tr><td colspan="6" style="text-align:center;padding:40px;color:var(--text-sub)">Loading…</td></tr>';
  try {
    if (!SHEET_KEY && !askKey()) throw new Error('no access key');
    const r = await fetch(SHEET_URL + '?key=' + encodeURIComponent(SHEET_KEY));
    if (!r.ok) throw new Error('fetch failed: ' + r.status);
    const rows = await r.json();
    if (rows && rows.error === 'unauthorized') {
      // Wrong or old key: forget it and ask again.
      try { localStorage.removeItem('tracker_key'); } catch (e) {}
      SHEET_KEY = '';
      if (askKey()) return load();
    }
    if (!Array.isArray(rows)) throw new Error(rows.error || 'bad response');
    data = rows;
    lastSaved = JSON.stringify(data);
    canSave = true;
  } catch(e) {
    // Show SEED read-only if the sheet is unreachable; never save it over the real data.
    console.error(e);
    data = SEED.map(s => ({ ...s }));
    alert('Could not load the tracker. Showing a read-only copy; changes will not be saved. Refresh to try again.');
  }
  buildTabs();
  render();
}

function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    const body = JSON.stringify(data);
    if (canSave && body !== lastSaved) {
      try {
        // text/plain keeps this a simple request (no CORS preflight, which Apps Script does not answer).
        const r = await fetch(SHEET_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ key: SHEET_KEY, rows: data })
        });
        const res = await r.json();
        if (!res.ok) throw new Error(res.error || 'save rejected');
        lastSaved = body;
      } catch(e) {
        console.error('Save failed:', e);
        alert('Save failed (' + e.message + '). Your last change was not stored. Refresh and try again.');
      }
    }
    buildTabs();
    updateStats();
  }, 600);
}

let activeView = 'active';
try { if (localStorage.getItem('tracker_view') === 'archive') activeView = 'archive'; } catch (e) {}

function inView(status) {
  return activeView === 'archive' ? status === 'Closed' : status !== 'Closed';
}
function viewRows() { return data.filter(r => inView(r.status)); }
function scopeRows() {
  const rows = viewRows();
  return activeTab === 'all' ? rows : rows.filter(r => r.type === activeTab);
}

function buildViewSwitch() {
  const archived = data.filter(r => r.status === 'Closed').length;
  const views = [
    { id: 'active',  label: 'Active',  count: data.length - archived },
    { id: 'archive', label: 'Archive', count: archived },
  ];
  const el = document.getElementById('view-switch');
  el.innerHTML = '';
  views.forEach(v => {
    const btn = document.createElement('button');
    btn.className = 'view-btn' + (activeView === v.id ? ' active' : '');
    btn.innerHTML = `${v.label} <span class="view-count">${v.count}</span>`;
    btn.onclick = () => {
      activeView = v.id;
      document.getElementById('filter-status').value = '';
      try { localStorage.setItem('tracker_view', v.id); } catch (e) {}
      buildViewSwitch(); buildTabs(); filterRows();
    };
    el.appendChild(btn);
  });
}

function buildTabs() {
  buildViewSwitch();
  const container = document.getElementById('tabs');
  container.innerHTML = '';
  const rows = viewRows();
  TABS.forEach(t => {
    const count = t.id === 'all' ? rows.length : rows.filter(r => r.type === t.id).length;
    const btn = document.createElement('button');
    btn.className = 'tab' + (activeTab === t.id ? ' active' : '');
    btn.innerHTML = `${t.label} <span class="tab-count">${count}</span>`;
    btn.onclick = () => { activeTab = t.id; buildTabs(); filterRows(); };
    container.appendChild(btn);
  });
}

    const ccHTML = `<span class="cc-toggle" onclick="toggleCC(${i})">${ccLabel} <svg width="10" height="10" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></span>

       <div class="cc-hint">One entry per line, e.g. Name — email@domain.com</div>`;
    const titleHTML = row.title ? `<div class="contact-title">${row.title}</div>` : '';
    const locationHTML = row.location ? `<div class="org-location">${row.location}</div>` : '';
    const tr = document.createElement('tr');
    tr.dataset.org    = row.org.toLowerCase();
    tr.dataset.type   = row.type;
    tr.dataset.status = row.status;
    tr.dataset.index  = i;
    tr.innerHTML = `
      <td>
        <div class="org-name">${row.org}</div>
        ${locationHTML}
      </td>
      <td>
        <div class="contact-name">${row.contact}</div>
        ${titleHTML}
        <div class="contact-email" contenteditable="true" spellcheck="false" onblur="updateEmail(${i},this.innerText)" title="Click to edit email">${row.email}</div>
        ${ccHTML}
      </td>
      <td style="white-space:nowrap">${row.date}</td>
      <td>
        <span class="status-pill ${statusClass}" title="Change status">
          <select class="status-select" onchange="setStatus(${i}, this)" aria-label="Status for ${row.org}">
            ${STATUS_CYCLE.concat(STATUS_CYCLE.includes(row.status) ? [] : [row.status])
              .map(s => `<option${s === row.status ? ' selected' : ''}>${s}</option>`).join('')}
          </select><span class="status-caret">▾</span>
        </span>
      </td>
      <td>
        <div class="followup-stack">
          <div class="followup-row next-row" title="Next follow-up to send"><span class="followup-label">Next</span><input type="date" class="fu-next${row.nextFU?' filled':''}${isDue(row.nextFU)?' due':isSoon(row.nextFU)?' soon':''}" value="${row.nextFU||''}" title="${row.nextFU ? (isDue(row.nextFU) ? 'Follow-up due' : isSoon(row.nextFU) ? 'Follow-up coming up this week' : 'Next follow-up') : 'Set the next follow-up date'}" onchange="updateFollowup(${i},'next',this.value,this)"></div>
          <div class="followup-row"><span class="followup-label">F/U 1</span><input type="date" class="fu-sent${row.followup1?' filled':''}" value="${row.followup1||''}" onchange="updateFollowup(${i},1,this.value,this)"></div>

        </div>
      </td>
      <td class="note-cell">
        <div class="note-text" contenteditable="true" data-idx="${i}" onblur="updateNote(${i},this.innerText)">${row.notes}</div>
      </td>
    `;
    tbody.appendChild(tr);
  });
  updateStats();
  filterRows();
}

function toggleCC(i) {
  document.getElementById(`cc-${i}`).classList.toggle('open');
}

function setStatus(i, el) {
  const prev = data[i].status;
  const next = el.value;
  if (next === prev) return;
  if (next === 'Closed' && !confirm(`Close ${data[i].org}? It will move to the Archive.`)) {
    el.value = prev;
    return;
  }
  data[i].status = next;
  save();
  render();
  buildTabs();
  const moved = (prev === 'Closed') !== (next === 'Closed');
  const where = moved ? (next === 'Closed' ? ' and moved to Archive' : ' and moved back to Active') : '';
  showUndo(`${data[i].org}: ${next}${where}`, () => {
    data[i].status = prev;
    save();
    render();
    buildTabs();
  });
}

let toastTimer;
function showUndo(msg, undo) {
  let t = document.getElementById('toast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'toast';
    t.className = 'toast';
    t.setAttribute('role', 'status');
    document.body.appendChild(t);
  }
  t.innerHTML = '';
  const span = document.createElement('span');
  span.textContent = msg;
  const btn = document.createElement('button');
  btn.textContent = 'Undo';
  btn.onclick = () => { clearTimeout(toastTimer); t.classList.remove('show'); undo(); };
  t.append(span, btn);
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 8000);
}

function todayISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function isDue(d) { return !!d && d <= todayISO(); }
function isSoon(d) {  // within the next 7 days: Basil gets a week's heads-up
  if (!d || isDue(d)) return false;
  const wk = new Date(); wk.setDate(wk.getDate() + 7);
  const lim = `${wk.getFullYear()}-${String(wk.getMonth() + 1).padStart(2, '0')}-${String(wk.getDate()).padStart(2, '0')}`;
  return d <= lim;
}

function updateFollowup(i, n, val, el) {
  data[i][n === 'next' ? 'nextFU' : `followup${n}`] = val;
  if (el) {
    el.classList.toggle('filled', !!val);
    if (n === 'next') { el.classList.toggle('due', isDue(val)); el.classList.toggle('soon', isSoon(val)); }
  }
  save();
}

function updateEmail(i, val) {
  data[i].email = val.trim();
  save();
}

function updateCC(i, val) {
  data[i].cc = val.split('\n').map(s => s.trim()).filter(s => s.length > 0);
  save();
  // refresh just the CC toggle label without full re-render
  const toggle = document.querySelector(`#cc-${i}`).previousElementSibling;
  const count = data[i].cc.length;
  toggle.childNodes[0].textContent = count > 0 ? `CC ${count} ` : '+ Add CC ';
}

function updateNote(i, val) {
  data[i].notes = val.trim();
  save();
}

// Tiles count every row in the current tab (Active and Archive together), so Closed is never stuck at 0.
// Clicking a tile filters the table to that status; clicking it again (or Total) clears the filter.
const NEXT_FU = '__next';  // pseudo-status: rows with a Next F/U date set
const STAT_TILES = [
  { label: 'Total',            filter: '' },
  { label: 'Draft Saved',      filter: 'Draft Saved' },
  { label: 'Sent / Waiting',   filter: 'Sent|Awaiting Reply' },
  { label: 'In Conversation',  filter: 'In Conversation' },
  { label: 'Follow-up Needed', filter: 'Follow-up Needed' },
  { label: 'Closed',           filter: 'Closed' },
  { label: 'Next F/U',         filter: NEXT_FU },
];

function updateStats() {
  const scope = activeTab === 'all' ? data : data.filter(r => r.type === activeTab);
  const current = document.getElementById('filter-status').value;
  const el = document.getElementById('stats');
  el.innerHTML = '';
  STAT_TILES.forEach(t => {
    const want = t.filter.split('|');
    const n = !t.filter ? scope.length
            : t.filter === NEXT_FU ? scope.filter(r => r.nextFU).length
            : scope.filter(r => want.includes(r.status)).length;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'stat' + (t.filter ? '' : ' stat-accent') + (t.filter === NEXT_FU ? ' stat-next' : '')
                  + (t.filter && current === t.filter ? ' active' : '');
    btn.title = t.filter ? `Show only ${t.label}` : 'Show everything';
    btn.innerHTML = `<div class="stat-value">${n}</div><div class="stat-label">${t.label}</div>`;
    btn.onclick = () => statClick(t.filter);
    el.appendChild(btn);
  });
}

function statClick(filter) {
  const sel = document.getElementById('filter-status');
  sel.value = (filter && sel.value !== filter) ? filter : '';
  // Closed rows live in Archive, everything else in Active
  if (sel.value) {
    activeView = sel.value === 'Closed' ? 'archive' : 'active';
    if (sel.value === NEXT_FU) sortByNextFU();
    try { localStorage.setItem('tracker_view', activeView); } catch (e) {}
    buildTabs();
  }
  filterRows();
}

function onSearchInput() {
  const val = document.getElementById('search').value;
  document.getElementById('search-clear').classList.toggle('visible', val.length > 0);
  filterRows();
}

function clearSearch() {
  document.getElementById('search').value = '';
  document.getElementById('search-clear').classList.remove('visible');
  filterRows();
}

function filterRows() {
  const q      = document.getElementById('search').value.toLowerCase();
  const status = document.getElementById('filter-status').value;
  let visible  = 0;
  document.querySelectorAll('#tbody tr').forEach(tr => {
    // a status filter decides on its own which rows show, so picking Closed works from the Active view too
    const matchView   = status ? true : inView(tr.dataset.status);
    const matchTab    = activeTab === 'all' || tr.dataset.type === activeTab;
    const matchQ      = !q      || tr.dataset.org.includes(q) || tr.innerText.toLowerCase().includes(q);
    const matchStatus = !status
      || (status === NEXT_FU ? !!data[tr.dataset.index].nextFU : status.split('|').includes(tr.dataset.status));
    const show = matchView && matchTab && matchQ && matchStatus;
    tr.classList.toggle('filtered-out', !show);
    if (show) visible++;
  });
  const total = scopeRows().length;
  const label = activeView === 'archive' ? 'archived' : 'active';
  document.getElementById('row-count').textContent =
    visible === total ? `Showing all ${total} ${label} entries` : `Showing ${visible} of ${total} ${label} entries`;
  updateStats();
}

// Next F/U view: soonest date first
function sortByNextFU() {
  data.sort((a, b) => (a.nextFU || '9999').localeCompare(b.nextFU || '9999'));
  render();
}

let sortCol = -1, sortAsc = true;
function sortTable(col) {
  if (sortCol === col) sortAsc = !sortAsc; else { sortCol = col; sortAsc = true; }
  document.querySelectorAll('th').forEach((th, i) => th.classList.toggle('sorted', i === col));
  const keys = ['org', 'contact', 'date', 'status'];
  data.sort((a, b) => {
    const va = (a[keys[col]] || '').toLowerCase();
    const vb = (b[keys[col]] || '').toLowerCase();
    return sortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
  });
  render();
}

function exportCSV() {
  const scope = scopeRows();
  const headers =['Organization','Location','Type','Primary Contact','Title','Email','CC','Date Pitched','Status','Next Follow-up','Follow-up 1','Follow-up 2','Follow-up 3','Notes'];
  const rows = scope.map(r => [
    r.org, r.location||'', r.type, r.contact, r.title, r.email,
    (r.cc||[]).join(' | '), r.date, r.status,
    r.nextFU||'', r.followup1||'', r.followup2||'', r.followup3||'', r.notes
  ].map(v => `"${(v||'').replace(/"/g,'""')}"`).join(','));
  const csv = [headers.join(','), ...rows].join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
  a.download = `partnership_tracker_${activeView}${activeTab !== 'all' ? '_' + activeTab.replace(/[^a-z]/gi,'_') : ''}.csv`;
  a.click();
}

load();
</script>
